# build-openwrt-system-image.yml
# Ophub amlogic-s9xxx-openwrt 适配 make.sh
# 适用：S905L / MG101，打包ImmortalWrt / OpenWrt
name: Build OpenWrt System Image

on:
  workflow_dispatch:
    inputs:
      openwrt_release:
        description: 'Select OpenWrt Release'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - immortalwrt
          - openwrt
      openwrt_version:
        description: 'Select OS Release (推荐 noble, 不要用 resolute)'
        required: true
        default: 'noble'
        type: choice
        options:
          - jammy
          - noble
          - bookworm
      openwrt_board:
        description: 'Select device board 【s905l-mg101】'
        required: true
        default: 's905l-mg101'
        type: string
      openwrt_kernel:
        description: 'Kernel version, e.g. 5.15.100'
        required: true
        default: '5.15'
        type: string
      auto_kernel:
        description: 'Auto use latest kernel'
        required: true
        default: true
        type: boolean
      kernel_repo:
        description: 'Kernel repo'
        required: true
        default: 'ophub/kernel'
        type: string
      kernel_usage:
        description: 'Kernel tag: stable / flippy / dev'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - flippy
          - dev
      openwrt_ip:
        description: 'OpenWrt LAN IP'
        required: true
        default: '192.168.1.1'
        type: string
      builder_name:
        description: 'Firmware signature'
        required: false
        default: 'ophub'
        type: string
      packages:
        description: 'Add extra packages (space separated)'
        required: false
        default: ''
        type: string
      extra_conf:
        description: 'Extra config file content'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set DNS & Replace Ubuntu mirror
        run: |
          sudo tee /etc/resolv.conf <<'EOF'
          nameserver 223.5.5.5
          nameserver 114.114.114.114
          EOF
          sudo sed -i 's/azure.archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          sudo sed -i 's/security.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g' /etc/apt/sources.list
          cat /etc/apt/sources.list

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev bison flex git curl wget unzip gzip xz-utils python3 python3-pip

      - name: Build firmware via local make.sh
        run: |
          AUTO_KERNEL="${{ inputs.auto_kernel }}"
          if [ "$AUTO_KERNEL" = true ];then AUTO_KERNEL_PARAM="-a";else AUTO_KERNEL_PARAM="";fi
          sudo chmod +x ./make.sh
          sudo ./make.sh \
            -b ${{ inputs.openwrt_board }} \
            -k ${{ inputs.openwrt_kernel }} \
            -r ${{ inputs.openwrt_release }} \
            -v ${{ inputs.openwrt_version }} \
            -ip ${{ inputs.openwrt_ip }} \
            $AUTO_KERNEL_PARAM \
            -kp ${{ inputs.kernel_repo }} \
            -ku ${{ inputs.kernel_usage }} \
            -n ${{ inputs.builder_name }} \
            -p "${{ inputs.packages }}" \
            -c "${{ inputs.extra_conf }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: ./out/*.img.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: OpenWrt-${{ github.run_number }}
          files: ./out/*.img.gz
